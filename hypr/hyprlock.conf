# Import noir theme colors
source = /home/kikoperex/.config/theme/colors-hyprland.conf

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    immediate_render = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $accent
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = hi kiko
    color = $muted
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# Password input box
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $border
    inner_color = rgba(11, 14, 13, 0.82)
    font_color = $text
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i></i>
    hide_input = false
    check_color = $sage
    fail_color = $red_hi
    fail_text = <i>Incorrect Password</i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -120
    halign = center
    valign = center
}

# Bottom corner info
label {
    monitor =
    text = cmd[update:30000] echo "$(uname -n)"
    color = rgba(199, 202, 206, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "uptime: $(uptime -p | sed 's/up //')"
    color = rgba(199, 202, 206, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}
