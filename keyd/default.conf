# keyd — remapeo global del teclado
# Caps Lock hace Escape al pulsarlo solo y, al mantenerlo, activa la capa
# nav con las flechas en h/j/k/l. Con Alt recupera su función normal.
# Instalado en /etc/keyd/default.conf por install.sh.

[ids]
*

[main]
capslock = overload(nav, esc)

[alt]
capslock = capslock

[nav]
j = left
k = down
l = up
semicolon = right
